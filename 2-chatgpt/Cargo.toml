[package]
name = "three-stack-shuffle"
version = "0.1.0"
edition = "2021"
description = "Simulator, sorting algorithms, and search tools for the A-D-B card machine"
license = "MIT"

[lib]
name = "three_stack_shuffle"
path = "src/lib.rs"

[[bin]]
name = "random-test"
path = "src/bin/random_test.rs"

[[bin]]
name = "random-bench"
path = "src/bin/random_bench.rs"

[[bin]]
name = "selection-diagnostic"
path = "src/bin/selection_diagnostic.rs"

[profile.release]
debug = true
